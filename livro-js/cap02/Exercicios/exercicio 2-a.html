<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercicio 2a</title>
  </head>
  <body>
    <h1>Farmacia JS</h1>
    <form action="">
      <p>
        Medicamento:
        <input type="text" id="inMedicamento" />
      </p>
      <p>
        Preço R$:
        <input type="text" id="inPreco" inputmode="decimal" required />
      </p>
      <input type="submit" value="Calcular preço" required />
    </form>
    <h3 id="outResp1"></h3>
    <h4 id="outResp2"></h4>

    <script>
      const frm = document.querySelector("form");
      const resp1 = document.querySelector("#outResp1");
      const resp2 = document.querySelector("#outResp2");

      frm.addEventListener("submit", (e) => {
        const preco = Number(frm.inPreco.value);
        const med = frm.inMedicamento.value;
        const soma = preco + preco;
        const desconto = soma % 1;
        const resultado = soma - desconto;

        resp1.innerText = `Promoção de ${med}`;
        resp2.innerText = `Leve 2 por apenas R$: ${resultado.toFixed(2)}`;

        e.preventDefault();
      });
    </script>
  </body>
</html>
