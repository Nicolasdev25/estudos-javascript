<meta charset="utf-8" />

<script>
  const valorJantar = Number(prompt("Digite o valor do jantar R$: "));
  const porcentGarcom = valorJantar * 0.1;
  const total = valorJantar + porcentGarcom;
  alert(
    `Taxa do garçom R$: ${porcentGarcom.toFixed(2)}\nTotal R$: ${total.toFixed(2)}`,
  );
</script>
