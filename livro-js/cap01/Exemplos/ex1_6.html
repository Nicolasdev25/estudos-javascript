<meta charset="utf-8" />

<script>
  // soma de 2 numeros
  const num1 = Number(prompt("1º Número: ")); // le os dados, number tem que ser colocado para nao concatenar
  const num2 = Number(prompt("2º Número: "));
  const soma = num1 + num2; // realiza a soma
  alert(`Soma é ${soma}`); // mostra o resultado
</script>
