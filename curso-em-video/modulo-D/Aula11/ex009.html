<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Identificando Nacionalidade</title>
  </head>
  <body>
    <h1>Identificador de Nacionalidade</h1>
    Você mora em qual pais? <input type="text" id="txtPais" />
    <input type="button" value="Checar" onclick="Checar()" />
    <div id="res"></div>

    <script>
      function Checar() {
        var tpais = document.getElementById("txtPais");
        var res = document.getElementById("res");
        var pais = tpais.value;

        res.innerHTML = `Seu País natal é : <strong>${pais}</strong>`;

        if (pais != "brasil") {
          res.innerHTML += `<p>Você vive na(o) ${pais}, você é estrangeiro(a)</p>`;
        } else {
          res.innerHTML += `<p>Você é Brasileira(o)</p>`;
        }
      }
    </script>
  </body>
</html>
